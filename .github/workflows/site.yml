name: site

# blunderbase.org is a static page on GitHub Pages, assembled from `site/` and the
# screenshots by `scripts/site.sh`. Pushing a change to any of those publishes it; nothing
# here touches the image or the running deployment. One-time setup, in the repository's
# settings: Pages → Source → "GitHub Actions", and a custom domain of `blunderbase.org`
# (the `CNAME` file in the artifact is what keeps it after a deploy).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site.sh'
      - 'docs/screenshots/**'
      - 'docs/design/brand/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
