name: site

# blunderbase.org is a static-assets Worker on Cloudflare, assembled from `site/` and the
# screenshots by `scripts/site.sh` and pushed with wrangler. A push that touches any of
# those publishes it; nothing here touches the image or the running deployment. One-time
# setup: an API token with "Workers Scripts: Edit" (and "Zone: DNS: Edit" for the custom
# domains) as the CLOUDFLARE_API_TOKEN secret, the account id as CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site.sh'
      - 'docs/screenshots/**'
      - 'docs/design/brand/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/site.sh
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
