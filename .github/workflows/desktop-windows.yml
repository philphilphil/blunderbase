name: desktop-windows

# Preview builds stay separate from releases until the installer is code-signed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: uv sync --frozen
      # Before the bundle: PyInstaller freezes `manual-site/` into it, so the manual has to
      # exist by the time `build:windows` runs.
      - run: uv run --group docs mkdocs build --strict
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir desktop install --frozen-lockfile
      - run: pnpm --dir desktop build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Blunderbase-Windows-x64-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
