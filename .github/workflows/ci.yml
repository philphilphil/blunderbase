name: ci

on:
  push:
    branches: [main]
    # `make release` cuts these; they publish the semver image tags below.
    tags: ['v*.*.*']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend tests

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  docker:
    # The published artifact, built only from a main — or a release tag — that the whole
    # suite has passed on. A pull request builds nothing: the image is what someone else
    # pulls and runs.
    needs: [lint, sqlite]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/philphilphil/blunderbase
          # `latest` is what compose pulls and only main moves it; the commit tag is what a
          # rollback names. A `vX.Y.Z` push adds `X.Y.Z` and the floating `X.Y` — the
          # action leaves both off for a prerelease, so `v1.2.0-rc.1` publishes only itself.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    # Only main moves `latest`, and `latest` is what the stack pulls — so a tag push
    # publishes its image but deliberately does not redeploy.
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: komodo-blunderbase
      cancel-in-progress: false
    env:
      KOMODO_URL: ${{ secrets.KOMODO_URL }}
      KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
      KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
      KOMODO_STACK: blunderbase
    steps:
      - name: Pull image on target server
        run: |
          curl -fsS --show-error --max-time 600 \
            -X POST "$KOMODO_URL/execute/PullStack" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d "{\"stack\":\"$KOMODO_STACK\"}"

      - name: Redeploy stack
        run: |
          curl -fsS --show-error --max-time 600 \
            -X POST "$KOMODO_URL/execute/DeployStack" \
            -H 'Content-Type: application/json' \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d "{\"stack\":\"$KOMODO_STACK\"}"
