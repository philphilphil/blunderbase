name: ci

# Code changes are linted and tested here. The production image is built once, by the
# release workflow; rebuilding it for every commit spends runner time without publishing
# anything.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'docs/**'

permissions:
  contents: read

# A newer commit on the same branch makes the older result obsolete. This matters most
# on main, where several small pushes would otherwise consume a full run each.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend tests
      # `engine`-marked tests want a real Stockfish or Maia binary and are not part of
      # any run here.
      - run: uv run pytest
      # `slow` is deselected from the default run — seven tests that wait out reconnect
      # windows and shutdown grace periods. CI opts into them once here.
      - run: uv run pytest -m slow

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The catalogs are checked in and extracted by hand (`pnpm i18n`); a string added
      # without re-running it would ship untranslatable. This fails the build instead.
      - run: pnpm i18n && git diff --exit-code -- src/locales
