name: ci

# Every push and every pull request: lint, test, and build the image. The build is the
# point — a Dockerfile or frontend break should fail here, not the first time someone
# cuts a release. Nothing is published unless a release triggered the run.
on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole file before it deploys, so the tag that ships is the tag
  # the suite passed on.
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend tests
      # `engine`-marked tests want a real Stockfish or Maia binary and are not part of
      # the default run.
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  image:
    # Built on every run so a broken Dockerfile fails a pull request. Pushed only when a
    # GitHub release triggered the run — the registry holds releases, not commits.
    needs: [backend, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/philphilphil/blunderbase
          # `latest` is what compose pulls, and only a full release moves it: a
          # prerelease publishes its own version tags and leaves `latest` where it was.
          # `latest=false` is load-bearing — the default `latest=auto` would re-add it on
          # any semver tag, prereleases included, and undo that guard. The sha tag is
          # what a rollback names.
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
