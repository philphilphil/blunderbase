name: ci

on:
  push:
    branches: [main]
    # `make release` cuts these; they publish the semver image tags below.
    tags: ['v*.*.*']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend tests

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  postgres:
    # The escape hatch is only honest if the suite runs against it: same tests, same
    # fixtures, a real PostgreSQL instead of SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blunderbase
          POSTGRES_PASSWORD: blunderbase
          POSTGRES_DB: blunderbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blunderbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest
        env:
          BLUNDERBASE_TEST_DATABASE_URL: postgresql+psycopg://blunderbase:blunderbase@127.0.0.1:5432/blunderbase

  docker:
    # The published artifact, built only from a main — or a release tag — that the whole
    # suite has passed on. A pull request builds nothing: the image is what someone else
    # pulls and runs.
    needs: [lint, sqlite, postgres]
    if: >-
      github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/philphilphil/blunderbase
          # `latest` is what compose pulls and only main moves it; the commit tag is what a
          # rollback names. A `vX.Y.Z` push adds `X.Y.Z` and the floating `X.Y` — the
          # action leaves both off for a prerelease, so `v1.2.0-rc.1` publishes only itself.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
