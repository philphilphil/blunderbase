name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend tests

  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest

  postgres:
    # The escape hatch is only honest if the suite runs against it: same tests, same
    # fixtures, a real PostgreSQL instead of SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blunderbase
          POSTGRES_PASSWORD: blunderbase
          POSTGRES_DB: blunderbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blunderbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest
        env:
          BLUNDERBASE_TEST_DATABASE_URL: postgresql+psycopg://blunderbase:blunderbase@127.0.0.1:5432/blunderbase
