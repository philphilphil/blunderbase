<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting Blunderbase</title>
    <style>
      :root {
        color: #e8e5de;
        background: #151719;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: auto;
        display: grid;
        place-items: center;
        border: 1px solid #3a4049;
        border-radius: 16px;
        font-size: 30px;
      }
      p {
        color: #949ca8;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">♞</div>
      <h1>Blunderbase</h1>
      <p id="status">Starting your library…</p>
    </main>
  </body>
</html>
