[project]
name = "blunderbase"
version = "0.1.0"
description = "A personal chess database with an AI coach as its centerpiece"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "chess>=1.11",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.0.0",
    "pydantic-settings>=2.4",
    # The runner reads its yaml with one and dials its socket with the other. Both arrive
    # today through `uvicorn[standard]`, and depending on that accident is not a plan.
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]

[project.scripts]
blunderbase = "backend.cli:main"
# Same package, same image, a different command: the runner is a headless worker that
# dials the server rather than a second deployment.
blunderbase-runner = "backend.runners.entrypoint:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "engine: needs a real Stockfish or Maia binary; excluded from the default run",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
