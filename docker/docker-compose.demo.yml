# The public demo. Setup is "A public demo" in docs/deploy.md.
services:
  blunderbase-demo:
    image: ghcr.io/philphilphil/blunderbase:latest
    container_name: blunderbase-demo
    restart: unless-stopped
    ports:
      # Loopback: it sits behind the same proxy as the owner's stack, on its own hostname.
      - "127.0.0.1:8766:8765"
    volumes:
      - blunderbase-demo-data:/data
    environment:
      BLUNDERBASE_RUNTIME_MODE: demo
      BLUNDERBASE_DB_PATH: /data/demo.db
      # Nothing is ever queued in a read-only library.
      BLUNDERBASE_ANALYSIS_WORKERS: "false"
      # Analysis boards a stranger can open at once; the default of three is for the phone.
      BLUNDERBASE_STREAM_MAX_SESSIONS: "2"

volumes:
  blunderbase-demo-data:
