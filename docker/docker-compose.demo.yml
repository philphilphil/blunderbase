# The public demo at demo.blunderbase.org. Setup is "A public demo" in docs/deploy.md.
services:
  blunderbase-demo:
    image: ghcr.io/philphilphil/blunderbase:latest
    container_name: blunderbase-demo
    restart: unless-stopped
    # The app bounds what a stranger can ask an engine for; these bound what the host can
    # lose if that is ever wrong, since Traefik and everything behind it share this machine.
    cpus: 2.0
    mem_limit: 3g
    networks:
      - gateway
    # Traefik terminates TLS and routes the hostname; nothing is published on the host.
    labels:
      traefik.enable: "true"
      traefik.docker.network: gateway
      traefik.http.routers.blunderbase-demo.rule: Host(`demo.blunderbase.org`)
      traefik.http.routers.blunderbase-demo.entrypoints: websecure
      traefik.http.routers.blunderbase-demo.tls.certresolver: myresolver
      traefik.http.services.blunderbase-demo.loadbalancer.server.port: "8765"
    volumes:
      - blunderbase-demo-data:/data
    environment:
      BLUNDERBASE_RUNTIME_MODE: demo
      BLUNDERBASE_DB_PATH: /data/demo.db
      # Nothing is ever queued in a read-only library.
      BLUNDERBASE_ANALYSIS_WORKERS: "false"
      # Analysis boards a stranger can open at once; the default of three is for the phone.
      BLUNDERBASE_STREAM_MAX_SESSIONS: "2"

networks:
  gateway:
    external: true

volumes:
  blunderbase-demo-data:
